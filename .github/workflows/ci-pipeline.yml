name: ci-pipeline
on:
    - push
    - pull_request
jobs:
    ci: 
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout Code
              uses: actions/checkout@v5
            - name: Setup Node
              uses: actions/setup-node@v6
              with: 
                node-version: '22.x'
            - name: Install modules
              run: npm ci
            - name: Build Application
              run: npm run build
            - name: Run Lint
              run: npm run lint
            - name: Run test
              run: npm run test      